name: history
# Nạp lại toàn bộ lịch sử (chạy tay hoặc khi danh mục chuỗi thay đổi)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [jobs/update.py]

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "requests>=2.32,<3"
      - name: Cập nhật số liệu (all)
        timeout-minutes: 20
        run: python jobs/update.py --mode all --out data
      - name: Ghi vào repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -q -m "data: all $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 7; done
