name: ci
# Kiểm thử engine và runner, kiểm web/ khớp mã nguồn, đóng gói trang (index.html + app.js + app.css < 300 KB),
# chạy E2E bằng Chrome ở 390 px và 1280 px.

on:
  push:
    branches: [main]
    paths: ["src/**", "web/**", "tools/**", "tests/**", "build.mjs", "package.json", "package-lock.json", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Kiểm thử
        run: npm test
      - name: web/ khớp mã nguồn (tác vụ 07:40 đăng giao diện từ web/)
        run: |
          node build.mjs --out /tmp/web-check > /dev/null
          diff -r web /tmp/web-check || { echo "web/ cũ: chạy npm run web rồi commit"; exit 1; }
      - name: Đóng gói và dựng bản xem thử từ số liệu hiện có
        run: |
          today=$(node -e "console.log(new Date(Date.now()+7*3600e3).toISOString().slice(0,10))")
          node tools/mrc.mjs daily --data data --state /tmp/ci-state --site /tmp/ci-site --today "$today" --weekly no --monthly no > /tmp/daily.json
          node build.mjs --preview /tmp/ci-site --state /tmp/ci-state
      - name: E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/e2e/ui.e2e.mjs --shots test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results
          retention-days: 7
