name: probe
# Gọi thử các nguồn số liệu ứng viên, ghi data/probe.json và data/probe.md vào repo.

on:
  schedule:
    - cron: "17 22 * * 0"   # sáng thứ Hai 05:17 giờ VN: theo dõi sức khỏe nguồn
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - jobs/probe.py
      - .github/workflows/probe.yml

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện bắt buộc
        run: python -m pip install --quiet "requests>=2.32,<3" "openpyxl>=3.1,<4"

      - name: Cài thư viện tùy chọn (akshare)
        continue-on-error: true
        run: python -m pip install --quiet "akshare>=1.20"

      - name: Gọi thử nguồn
        timeout-minutes: 16
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python jobs/probe.py --out data

      - name: Ghi kết quả vào repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json data/probe.md || true
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "probe: kết quả gọi thử nguồn $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
