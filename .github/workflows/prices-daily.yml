name: prices-daily
# Giá 14 tài sản, VIX, DXY: sau khi nến ngày UTC của crypto khép, trước tác vụ 07:40

on:
  schedule:
    - cron: "9 0 * * *"    # 07:09 giờ Việt Nam
    - cron: "29 0 * * *"   # 07:29: chạy lại nếu lần trước trễ hoặc lỗi
    - cron: "52 0 * * *"   # 07:52: dự phòng khi cron GitHub trễ
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "requests>=2.32,<3"
      - name: Cập nhật số liệu (prices)
        timeout-minutes: 20
        run: python jobs/update.py --mode prices --out data
      - name: Ghi vào repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -q -m "data: prices $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 7; done
